<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEXUS v3.5 — المنبع الإمبراطوري</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #050b14;
      font-family: 'Inter', sans-serif;
      color: #e8f4f8;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a3440;
    }
    .title h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #fff, #00e0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .badge {
      font-family: monospace;
      background: #0a2a38;
      padding: 4px 12px;
      border-radius: 24px;
      font-size: 0.75rem;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #0a1620;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid #1a3440;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f1f2c;
      padding: 5px 12px;
      border-radius: 40px;
    }
    select, button {
      background: #0f1f2c;
      border: 1px solid #2a5a6a;
      color: #e8f4f8;
      padding: 6px 12px;
      border-radius: 24px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover {
      background: #1a4a5a;
      border-color: #00e0ff;
    }
    .metric-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #0a1620;
      border: 1px solid #1a3440;
      border-radius: 16px;
      padding: 12px 16px;
    }
    .card-label {
      font-size: 0.7rem;
      color: #6a8a9a;
      letter-spacing: 1px;
    }
    .card-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: monospace;
    }
    .signal {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .signal.BUY { color: #00e676; }
    .signal.SELL { color: #ff3d5a; }
    .signal.NEUTRAL { color: #ffaa00; }
    .reason {
      font-size: 0.8rem;
      color: #9ab0c0;
      margin-top: 8px;
    }
    .candles-container {
      background: #0a1620;
      border: 1px solid #1a3440;
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #030a12;
      border-radius: 12px;
    }
    .audio-toggle {
      background: #0f2a2a;
      border-color: #2a7a6a;
    }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.7rem;
      color: #4a6a7a;
      border-top: 1px solid #1a3440;
      padding-top: 16px;
    }
    @media (max-width: 700px) {
      .metric-panel { grid-template-columns: repeat(2,1fr); }
      .card-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title"><h1>⧉ NEXUS v3.5 — المنبع الإمبراطوري</h1></div>
    <div class="badge">Binance · 1h candles · AI Analytics</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <span>📊 الزوج</span>
      <select id="symbolSelect">
        <option value="BTCUSDT">BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
        <option value="BNBUSDT">BNB/USDT</option>
        <option value="SOLUSDT">SOL/USDT</option>
        <option value="XRPUSDT">XRP/USDT</option>
      </select>
    </div>
    <div class="control-group">
      <span>⏱️ الفاصل</span>
      <select id="intervalSelect">
        <option value="15m">15 دقيقة</option>
        <option value="1h" selected>1 ساعة</option>
        <option value="4h">4 ساعات</option>
        <option value="1d">يومي</option>
      </select>
    </div>
    <div class="control-group">
      <span>💰 رصيد الحساب ($)</span>
      <input type="number" id="balanceInput" value="10000" step="500" style="width:100px; background:#0f1f2c; border:1px solid #2a5a6a; color:white; border-radius:20px; padding:6px;">
    </div>
    <div class="control-group">
      <span>⚡ المخاطرة (%)</span>
      <input type="number" id="riskInput" value="2" step="0.5" style="width:70px;">
    </div>
    <div class="control-group">
      <button id="refreshBtn">🔄 تحديث البيانات</button>
      <button id="audioToggleBtn" class="audio-toggle">🔊 تشغيل الصوت</button>
    </div>
  </div>

  <div class="metric-panel" id="metricsPanel">
    <!-- سيتم تعبئتها بواسطة JS -->
  </div>

  <div class="candles-container">
    <canvas id="candleCanvas" width="800" height="400" style="width:100%; height:auto; max-height:400px"></canvas>
  </div>

  <footer>
    NEXUS v3.5 — محرك تحليل فوري | بيانات Binance | توصيات آلية مع إدارة المخاطر
  </footer>
</div>

<script src="index.js"></script>
</body>
</html>
