<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEXUS v3.5 PRO — منصة التداول الذكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at 20% 30%, #0a0f1a, #03060c);
      font-family: 'Inter', sans-serif;
      color: #e8f4f8;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* تأثيرات زجاجية و glow */
    .glass {
      background: rgba(10, 20, 30, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 224, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 224, 255, 0.05) inset;
    }

    .glow-text {
      text-shadow: 0 0 12px rgba(0, 224, 255, 0.4);
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 24px;
      background: rgba(5, 15, 25, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(0, 224, 255, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #00e0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .badge {
      background: rgba(0, 224, 255, 0.12);
      border: 1px solid #00e0ff40;
      padding: 6px 14px;
      border-radius: 40px;
      font-family: monospace;
      font-size: 0.7rem;
    }

    /* لوحة التحكم */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(5, 15, 25, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      border: 1px solid rgba(0, 224, 255, 0.15);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 40px;
      border: 1px solid rgba(0, 224, 255, 0.2);
    }

    select, input, button {
      background: #0f1f2c;
      border: 1px solid #2a5a6a;
      color: #e8f4f8;
      padding: 6px 14px;
      border-radius: 32px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button {
      background: linear-gradient(135deg, #0f2a3a, #0a1a28);
      border-color: #00e0ff60;
    }

    button:hover {
      background: #1a4a5a;
      border-color: #00e0ff;
      transform: scale(1.02);
      box-shadow: 0 0 12px rgba(0, 224, 255, 0.3);
    }

    /* بطاقات المعلومات الحية */
    .live-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 16px;
      background: rgba(10, 20, 35, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      border: 1px solid rgba(0, 224, 255, 0.2);
      transition: 0.2s;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7a9aba;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: monospace;
    }

    .stat-change {
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .positive { color: #00e676; }
    .negative { color: #ff3d5a; }

    /* منطقة التحليل */
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .analysis-card {
      padding: 20px;
    }

    .signal-badge {
      font-size: 2rem;
      font-weight: 800;
      margin: 8px 0;
    }

    .signal-badge.BUY { color: #00e676; text-shadow: 0 0 10px #00e67640; }
    .signal-badge.SELL { color: #ff3d5a; text-shadow: 0 0 10px #ff3d5a40; }
    .signal-badge.NEUTRAL { color: #ffaa00; }

    /* حاوية الشموع */
    .chart-container {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 28px;
      padding: 20px;
      border: 1px solid rgba(0, 224, 255, 0.2);
      margin-bottom: 24px;
    }

    canvas {
      width: 100%;
      height: auto;
      background: #010a12;
      border-radius: 16px;
      display: block;
    }

    /* تذييل */
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #4a6a8a;
      padding: 16px;
      border-top: 1px solid rgba(0, 224, 255, 0.1);
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .stat-value { font-size: 1.2rem; }
      .signal-badge { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <h1>⧉ NEXUS v3.5 PRO</h1>
      <div class="badge">Binance · Live Data · AI Analytics</div>
    </div>
    <div class="live-time" id="liveTime"></div>
  </div>

  <!-- Control Panel -->
  <div class="control-panel">
    <div class="control-group">
      <span>📊 الزوج</span>
      <select id="symbolSelect">
        <option value="BTCUSDT">BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
        <option value="BNBUSDT">BNB/USDT</option>
        <option value="SOLUSDT">SOL/USDT</option>
        <option value="XRPUSDT">XRP/USDT</option>
      </select>
    </div>
    <div class="control-group">
      <span>⏱️ الفاصل</span>
      <select id="intervalSelect">
        <option value="15m">15 دقيقة</option>
        <option value="1h" selected>1 ساعة</option>
        <option value="4h">4 ساعات</option>
        <option value="1d">يومي</option>
      </select>
    </div>
    <div class="control-group">
      <span>💰 الرصيد ($)</span>
      <input type="number" id="balanceInput" value="10000" step="500" style="width:100px;">
    </div>
    <div class="control-group">
      <span>⚡ المخاطرة (%)</span>
      <input type="number" id="riskInput" value="2" step="0.5" style="width:70px;">
    </div>
    <div class="control-group">
      <button id="refreshBtn">🔄 تحديث يدوي</button>
      <button id="audioToggleBtn" class="audio-toggle">🔊 تشغيل الصوت</button>
    </div>
  </div>

  <!-- Live Stats (أرقام حية) -->
  <div class="live-stats" id="liveStats">
    <div class="stat-card"><div class="stat-label">السعر الحالي</div><div class="stat-value" id="livePrice">--</div><div class="stat-change" id="priceChange">--</div></div>
    <div class="stat-card"><div class="stat-label">الطلب (Bid)</div><div class="stat-value" id="bidPrice">--</div></div>
    <div class="stat-card"><div class="stat-label">العرض (Ask)</div><div class="stat-value" id="askPrice">--</div></div>
    <div class="stat-card"><div class="stat-label">حجم 24h</div><div class="stat-value" id="volume24h">--</div></div>
  </div>

  <!-- Analysis Cards -->
  <div class="analysis-grid" id="analysisGrid">
    <!-- يتم تعبئتها بواسطة JS -->
  </div>

  <!-- Chart -->
  <div class="chart-container">
    <canvas id="candleCanvas" width="1000" height="400" style="width:100%; height:auto; max-height:450px"></canvas>
  </div>

  <div class="footer">
    NEXUS v3.5 PRO — تحديث حي كل 5 ثوانٍ | بيانات Binance | توصيات آلية مع إدارة المخاطر
  </div>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
